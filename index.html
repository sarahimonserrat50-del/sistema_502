<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Integrador - Grupo 502</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; margin: 0; padding: 20px; color: #333; }
        .box { background: white; padding: 25px; border-radius: 8px; max-width: 550px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; font-size: 14px; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        .card-prod { background: #f8f9fa; padding: 12px; margin-top: 10px; border-radius: 6px; border-left: 5px solid #28a745; display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none; }
        .error-msg { color: #dc3545; font-size: 13px; font-weight: bold; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    </style>
</head>
<body>

    <!-- MÓDULO 1: ACCESO (LOGIN) -->
    <div id="secLogin" class="box">
        <h2>🔐 Control de Acceso</h2>
        <p style="font-size: 13px; color: #666;">Ingrese la clave de administrador para continuar (Clave: <b>cecytec2026</b>)</p>
        <label>Clave de Acceso:</label>
        <input type="password" id="txtClave" placeholder="Escribe la clave...">
        <button onclick="validarAcceso()">Ingresar al Sistema</button>
        <p id="msgLogin" class="error-msg"></p>
    </div>

    <!-- MÓDULO 2: PANEL CRUD / COMERCIAL (OCULTO INICIALMENTE) -->
    <div id="secPanel" class="box hidden">
        <header>
            <h2 style="margin:0; color:#007bff;">📦 Inventario Comercial</h2>
            <button class="btn-danger" style="width: auto; padding: 6px 12px; margin:0;" onclick="cerrarSesion()">Cerrar Sesión</button>
        </header>

        <label>Nombre del Artículo:</label>
        <input type="text" id="nombreArt" placeholder="Ej. Multímetro digital">
        
        <label>Precio ($ MXN):</label>
        <input type="number" step="0.01" id="precioArt" placeholder="Ej. 350.00">
        
        <button class="btn-success" onclick="guardarRegistro()">Guardar en Inventario</button>

        <h3 style="margin-top: 20px;">Artículos Registrados</h3>
        <div id="contenedorGrid"></div>
    </div>

    <script>
        const CLAVE_SISTEMA = "cecytec2026";

        function validarAcceso() {
            let claveIngresada = document.getElementById("txtClave").value;
            if (claveIngresada === CLAVE_SISTEMA) {
                document.getElementById("secLogin").classList.add("hidden");
                document.getElementById("secPanel").classList.remove("hidden");
                renderizar();
            } else {
                document.getElementById("msgLogin").innerText = "Clave incorrecta. Intente nuevamente.";
            }
        }

        function cerrarSesion() {
            document.getElementById("txtClave").value = "";
            document.getElementById("msgLogin").innerText = "";
            document.getElementById("secPanel").classList.add("hidden");
            document.getElementById("secLogin").classList.remove("hidden");
        }

        function obtenerDatos() {
            let datos = localStorage.getItem("integrador_unificado_502");
            return datos ? JSON.parse(datos) : [];
        }

        function guardarRegistro() {
            let nom = document.getElementById("nombreArt").value.trim();
            let pre = document.getElementById("precioArt").value.trim();

            if (!nom || !pre) {
                alert("Por favor complete todos los campos.");
                return;
            }

            let lista = obtenerDatos();
            lista.push({ nombre: nom, precio: parseFloat(pre).toFixed(2) });
            localStorage.setItem("integrador_unificado_502", JSON.stringify(lista));

            document.getElementById("nombreArt").value = "";
            document.getElementById("precioArt").value = "";
            renderizar();
        }

        function renderizar() {
            let lista = obtenerDatos();
            let div = document.getElementById("contenedorGrid");
            div.innerHTML = "";

            if (lista.length === 0) {
                div.innerHTML = "<p style='color:#777; font-size:13px;'>No hay artículos registrados en el inventario.</p>";
                return;
            }

            lista.forEach((item, index) => {
                div.innerHTML += `
                    <div class="card-prod">
                        <div>
                            <strong>${item.nombre}</strong><br>
                            <span style="color:#28a745; font-weight:bold;">$${item.precio} MXN</span>
                        </div>
                        <button class="btn-danger" style="width:auto; padding:5px 10px; margin:0;" onclick="eliminarRegistro(${index})">Eliminar</button>
                    </div>
                `;
            });
        }

        function eliminarRegistro(index) {
            if (confirm("¿Desea eliminar este artículo del inventario?")) {
                let lista = obtenerDatos();
                lista.splice(index, 1);
                localStorage.setItem("integrador_unificado_502", JSON.stringify(lista));
                renderizar();
            }
        }
    </script>
</body>
</html>
